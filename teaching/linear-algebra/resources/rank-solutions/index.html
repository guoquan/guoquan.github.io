<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方程的交点与列向量组合</title><style>
:root{color-scheme:light;--ink:#18333d;--blue:#206b89;--red:#aa533d;--paper:#f5f3ec}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 system-ui,"PingFang SC",sans-serif}main{max-width:1400px;margin:auto;padding:28px 36px}header{display:flex;align-items:baseline;gap:24px}h1{font-size:32px;margin:0}header span{color:#657375;font-size:16px}.controls{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:24px 0}button{border:1px solid #b6c3c3;border-radius:6px;background:white;padding:9px 18px;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--blue);color:white}label{display:flex;align-items:center;gap:10px}input{width:170px;accent-color:var(--blue)}output,.math{font-family:"Cambria Math","STIX Two Math",serif;font-size:22px}.math i{font-style:italic}.panels{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:#fffdf8;border:1px solid #d4dad7;border-radius:10px;padding:18px}h2{font-size:21px;margin:0 0 6px}canvas{width:100%;height:390px;display:block}.equation{min-height:42px;text-align:center}.conclusion{display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-top:24px;padding:18px 24px;background:#e5ece8;border-radius:8px}#state{font-size:27px;font-weight:650}#solution{font-size:22px}small{display:block;margin-top:12px;color:#61716e}@media(max-width:800px){main{padding:18px}.panels{grid-template-columns:1fr}canvas{height:320px}header{display:block}}</style>
<main><header><h1>方程的交点与列向量组合</h1><span>同一个线性方程组，两种空间图像</span></header>
<div class="controls"><button data-k="-1" data-c="0">唯一解</button><button data-k="1" data-c="2">无穷多解</button><button data-k="1" data-c="3">无解</button><label>λ <input id="k" aria-label="第二个方程的参数λ" type="range" min="-2" max="3" step="0.1" value="-1"><output id="kv"></output></label><label>c <input id="c" aria-label="第二个方程的常数c" type="range" min="-2" max="5" step="0.1" value="0"><output id="cv"></output></label></div>
<div class="panels"><section class="panel"><h2>方程组视角 · 输入空间</h2><div class="equation math"><i>x</i> + <i>y</i> = 2；　<i>x</i> + λ<i>y</i> = <i>c</i></div><canvas id="row" aria-label="两个方程在xy坐标系中的直线及公共解"></canvas><div>两条直线的公共点，就是满足全部方程的输入。</div></section>
<section class="panel"><h2>列向量组合视角 · 输出空间</h2><div class="equation math"><i>x</i> (1, 1)<sup>T</sup> + <i>y</i> (1, λ)<sup>T</sup> = (2, <i>c</i>)<sup>T</sup></div><canvas id="col" aria-label="两列向量、目标向量以及唯一解时的组合"></canvas><div>目标能否组合出来？能组合出来时，系数是否唯一？</div></section></div>
<div class="conclusion" aria-live="polite"><span id="state"></span><span class="math" id="rank"></span><span class="math" id="solution"></span></div><small>蓝色表示第一个条件或第一列；棕色表示第二个条件或第二列；金色表示目标。这里的解允许取任意实数。</small>
</main><script>
const kEl=document.getElementById('k'),cEl=document.getElementById('c');const fmt=v=>Math.abs(v)<1e-9?'0':Number(v.toFixed(2)).toString();
function analyze(k,c){if(Math.abs(k-1)<1e-8)return {a:1,b:Math.abs(c-2)<1e-8?1:2,kind:Math.abs(c-2)<1e-8?'infinite':'none'};return {a:2,b:2,kind:'unique',x:(2*k-c)/(k-1),y:(c-2)/(k-1)}}
function axes(id,extent){const el=document.getElementById(id),d=devicePixelRatio||1,w=el.clientWidth,h=el.clientHeight;el.width=w*d;el.height=h*d;const ctx=el.getContext('2d');ctx.scale(d,d);ctx.clearRect(0,0,w,h);const s=Math.min(w,h)/(2*extent),cx=w/2,cy=h/2;const xy=(x,y)=>[cx+x*s,cy-y*s];ctx.lineWidth=1;ctx.strokeStyle='#e3e7e2';ctx.font='12px system-ui';ctx.fillStyle='#74827e';for(let v=-extent;v<=extent;v++){ctx.beginPath();ctx.moveTo(...xy(v,-extent));ctx.lineTo(...xy(v,extent));ctx.stroke();ctx.beginPath();ctx.moveTo(...xy(-extent,v));ctx.lineTo(...xy(extent,v));ctx.stroke();if(v){ctx.fillText(v,...xy(v,-.24));ctx.fillText(v,...xy(.1,v));}}ctx.strokeStyle='#7a8e8b';ctx.lineWidth=1.5;for(const q of [[-extent,0,extent,0],[0,-extent,0,extent]]){ctx.beginPath();ctx.moveTo(...xy(q[0],q[1]));ctx.lineTo(...xy(q[2],q[3]));ctx.stroke();}return {ctx,xy,extent};}
function segment(g,x1,y1,x2,y2,col,width=3,dash=[]){g.ctx.strokeStyle=col;g.ctx.lineWidth=width;g.ctx.setLineDash(dash);g.ctx.beginPath();g.ctx.moveTo(...g.xy(x1,y1));g.ctx.lineTo(...g.xy(x2,y2));g.ctx.stroke();g.ctx.setLineDash([])}
function point(g,x,y,col,label){const p=g.xy(x,y),ctx=g.ctx;ctx.fillStyle=col;ctx.beginPath();ctx.arc(...p,6,0,2*Math.PI);ctx.fill();if(label){ctx.font='15px system-ui';ctx.fillText(label,p[0]+9,p[1]-10)}}
function arrow(g,x,y,col,label){segment(g,0,0,x,y,col);const p=g.xy(x,y),o=g.xy(0,0),a=Math.atan2(p[1]-o[1],p[0]-o[0]);g.ctx.fillStyle=col;g.ctx.beginPath();g.ctx.moveTo(...p);g.ctx.lineTo(p[0]-12*Math.cos(a-.4),p[1]-12*Math.sin(a-.4));g.ctx.lineTo(p[0]-12*Math.cos(a+.4),p[1]-12*Math.sin(a+.4));g.ctx.closePath();g.ctx.fill();point(g,x,y,col,label)}
function render(){let k=+kEl.value,c=+cEl.value,a=analyze(k,c);document.getElementById('kv').textContent=fmt(k);document.getElementById('cv').textContent=fmt(c);for(const b of document.querySelectorAll('button[data-k]'))b.setAttribute('aria-pressed',+b.dataset.k===k&&+b.dataset.c===c);
const row=axes('row',5);segment(row,-6,8,8,-6,'#206b89');segment(row,c-k*(-6),-6,c-k*6,6,'#aa533d',a.kind==='infinite'?5:3,a.kind==='infinite'?[10,6]:[]);if(a.kind==='unique'){if(Math.abs(a.x)<=5&&Math.abs(a.y)<=5)point(row,a.x,a.y,'#8c781f',`(${fmt(a.x)}, ${fmt(a.y)})`);else row.ctx.fillText('交点在当前视野之外',20,25)}
const col=axes('col',5);if(k===1)segment(col,-5,-5,5,5,'#b4c4b7',12);arrow(col,1,1,'#206b89',k===1?'':'第一列');arrow(col,1,k,'#aa533d',k===1?'两列重合':'第二列');arrow(col,2,c,'#8c781f','目标');if(a.kind==='unique'&&Math.max(Math.abs(a.x),Math.abs(a.y),Math.abs(k*a.y))<=8){segment(col,0,0,a.x,a.x,'#206b89',2,[6,5]);segment(col,a.x,a.x,2,c,'#aa533d',2,[6,5]);}
document.getElementById('state').textContent={unique:'有唯一解',infinite:'有无穷多解',none:'无解'}[a.kind];document.getElementById('rank').textContent=`R(A) = ${a.a}，R(A,b) = ${a.b}`;document.getElementById('solution').textContent=a.kind==='unique'?`x = ${fmt(a.x)}，y = ${fmt(a.y)}`:a.kind==='infinite'?'x = 2 − t，y = t（t为任意实数）':'目标不在两列向量可组合到的直线上';}
for(const e of [kEl,cEl])e.addEventListener('input',render);for(const b of document.querySelectorAll('button[data-k]'))b.onclick=()=>{kEl.value=b.dataset.k;cEl.value=b.dataset.c;render()};window.addEventListener('resize',render);render();window.rankDemo={analyze};
</script></html>
