<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>行列式：有向面积</title>
<style>
:root{color-scheme:light;--ink:#193a48;--blue:#246b87;--brown:#a65b3c;--paper:#f5f2e9;--line:#cfd5ce;--soft:#e7ede9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:14px 26px}header{display:flex;align-items:center;gap:20px}h1{font-size:30px;line-height:1.3;margin:0}header p{margin:0;color:#687677;font-size:17px}.icon{margin-left:auto;width:38px;height:38px;padding:4px;font-size:24px}button{background:#fffdf7;color:inherit;border:1px solid #bac6c6;border-radius:5px;padding:6px 14px;font:inherit;cursor:pointer}button:hover{background:#e9efec}button:focus-visible,input:focus-visible,[role=slider]:focus-visible{outline:3px solid #d59c44;outline-offset:4px}.presets{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 12px}.presets button{font-size:17px}.presets button[aria-pressed=true]{background:var(--ink);color:white}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}.plot{background:#fffdf8;border:1px solid var(--line);border-radius:8px;overflow:hidden}.plot svg{display:block;width:100%;height:435px;max-height:calc(100vh - 265px);touch-action:none}.plotnote{padding:0 14px 9px;color:#657474;font-size:15px}.math{font-family:"Cambria Math","STIX Two Math",serif;font-size:23px}.math i{font-style:italic}.matrixrow{display:flex;align-items:center;gap:12px;margin:6px 0}.matrix{display:grid;grid-template-columns:repeat(2,minmax(52px,auto));column-gap:14px;row-gap:2px;position:relative;padding:0 12px;text-align:center;font-variant-numeric:tabular-nums}.matrix:before,.matrix:after{content:"";position:absolute;top:0;bottom:0;width:7px;border-top:1.5px solid;border-bottom:1.5px solid}.matrix:before{left:0;border-left:1.5px solid}.matrix:after{right:0;border-right:1.5px solid}h2{font-size:20px;font-weight:650;margin:3px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}.controls label{display:grid;grid-template-columns:20px 1fr 45px;align-items:center;gap:6px}.controls input{width:100%;min-width:0;accent-color:var(--blue)}output{font-variant-numeric:tabular-nums}.result{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}.result p{margin:3px 0}.result strong{font-size:26px}#sign{font-size:18px;min-height:31px}.target-value{font-size:19px;color:#607177}.playback{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.playback input{flex:1;min-width:160px;accent-color:var(--blue)}.explain{margin:8px 0 0;font-size:17px;color:#415b64}.legend{display:flex;gap:20px;margin-top:6px;font-size:15px}.legend span:before{content:"";display:inline-block;width:18px;height:3px;margin:0 7px 4px 0;background:var(--blue)}.legend .brown:before{background:var(--brown)}.legend .gray:before{background:#aab5b4}svg text{font-family:"Cambria Math","PingFang SC",serif;pointer-events:none}svg .handle{cursor:grab;touch-action:none}svg .handle:active{cursor:grabbing}svg .tick{fill:#768683;font-size:12px}svg .basis-label{font-size:21px;font-style:italic}svg .handle:focus{outline:none;stroke:#d59c44;stroke-width:5}small{font-size:14px;line-height:1.4;display:block;color:#617574}button:disabled{opacity:.5;cursor:default}@media(min-width:901px) and (max-height:760px){.sidebar{font-size:16px;line-height:1.45}.math{font-size:22px}.result strong{font-size:25px}.plotnote{font-size:14px}.controls{gap:6px 14px}.target-value{margin:9px 0}}@media(max-width:900px){main{padding:18px}.workspace{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:16px}.result{margin:0;border:0;padding:0}header{flex-wrap:wrap}header p{width:calc(100% - 55px);order:2}.icon{margin-left:auto}.plot svg{height:440px;max-height:none}}@media(max-width:540px){h1{font-size:26px}.sidebar{display:block}.result{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}.controls{gap:8px}.presets button{padding:7px 10px;font-size:16px}}
</style>
</head>
<body><main>
<header><h1>行列式：有向面积</h1><p>一个数，记录面积缩放与方向</p><button id="fullscreen" class="icon" aria-label="进入全屏" title="进入全屏">⛶</button></header>
<div class="presets" aria-label="选择目标矩阵">
<button data-m="1,0,0,1">单位</button><button data-m="2,0,0,1">放大</button><button data-m="1,1,0,1">剪切</button><button data-m="-1,0,0,1">反向</button><button data-m="1,2,1,2">压扁</button><button id="reset">重置</button>
</div>
<div class="workspace"><section class="plot" aria-label="单位正方形及其变换后的平行四边形">
<svg id="plot" viewBox="0 0 720 570" role="img" aria-labelledby="plot-title plot-desc">
<title id="plot-title">单位正方形与变换后的有向面积</title><desc id="plot-desc">拖动蓝色和棕色端点改变目标矩阵的两列。也可使用右侧四个滑块或键盘方向键。</desc>
<defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#246b87"/></marker><marker id="brown-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a65b3c"/></marker><marker id="boundary-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536b72"/></marker></defs>
<g id="grid"></g><polygon id="unit" fill="#b6c5c0" fill-opacity=".12" stroke="#9daea9" stroke-width="2" stroke-dasharray="6 5"/>
<polygon id="parallelogram" fill="#246b87" fill-opacity=".18" stroke="#536b72" stroke-width="2"/>
<path id="boundary" fill="none" stroke="#536b72" stroke-width="2" marker-end="url(#boundary-arrow)"/>
<line id="u-line" stroke="#246b87" stroke-width="3" marker-end="url(#blue-arrow)"/><line id="v-line" stroke="#a65b3c" stroke-width="3" marker-end="url(#brown-arrow)"/>
<text id="origin" fill="#5b706f" font-size="17">O</text><text id="sum-label" fill="#536b72" font-size="18">u + v</text><text id="u-label" class="basis-label" fill="#246b87">u</text><text id="v-label" class="basis-label" fill="#a65b3c">v</text>
<circle id="u-handle" class="handle" r="8" fill="#246b87" stroke="#fffdf8" stroke-width="2" tabindex="0" role="slider" aria-label="第一列向量端点，左右键改变a，上下键改变c" aria-valuemin="-3" aria-valuemax="3"/>
<circle id="v-handle" class="handle" r="8" fill="#a65b3c" stroke="#fffdf8" stroke-width="2" tabindex="0" role="slider" aria-label="第二列向量端点，左右键改变b，上下键改变d" aria-valuemin="-3" aria-valuemax="3"/>
</svg><div class="plotnote">拖动两列向量端点，或使用滑块。虚线是原单位正方形；边界箭头跟随 O → u → u + v → v → O。</div>
</section>
<aside class="sidebar"><section><h2>目标矩阵</h2><div class="matrixrow math"><b><i>A</i></b><span>=</span><span id="target-matrix" class="matrix"></span></div>
<div class="controls">
<label><i>a</i><input id="a" type="range" min="-3" max="3" step="0.1" value="1" aria-label="矩阵第一行第一列a"><output id="a-value"></output></label>
<label><i>b</i><input id="b" type="range" min="-3" max="3" step="0.1" value="0" aria-label="矩阵第一行第二列b"><output id="b-value"></output></label>
<label><i>c</i><input id="c" type="range" min="-3" max="3" step="0.1" value="0" aria-label="矩阵第二行第一列c"><output id="c-value"></output></label>
<label><i>d</i><input id="d" type="range" min="-3" max="3" step="0.1" value="1" aria-label="矩阵第二行第二列d"><output id="d-value"></output></label>
</div><p class="math target-value">det <b><i>A</i></b> = <i>ad</i> − <i>bc</i> = <span id="target-det"></span></p></section>
<section class="result"><h2>当前图形</h2><div class="math"><b><i>B</i></b>(<i>t</i>) = (1 − <i>t</i>)<b><i>I</i></b> + <i>t</i><b><i>A</i></b></div><div class="matrixrow math"><b><i>B</i></b><span>=</span><span id="current-matrix" class="matrix"></span></div>
<p>有向面积 <strong id="oriented" class="math"></strong></p><p>实际面积 <strong id="area" class="math"></strong></p><p id="sign" aria-live="polite"></p><small>图中 u、v 是当前矩阵 B 的第一列、第二列；t = 1 时，B = A。</small></section></aside></div>
<div class="playback"><button id="play">播放变换</button><label for="progress" class="math"><i>t</i> = <output id="progress-value">1</output></label><input id="progress" type="range" min="0" max="1" step="0.01" value="1" aria-label="变换进度t，从单位矩阵到目标矩阵"><button id="finish">到达目标</button></div>
<div class="legend"><span>第一列 u</span><span class="brown">第二列 v</span><span class="gray">原单位正方形</span></div>
<p class="explain">先预测，再观察：剪切会改变面积吗？反向时负号表示什么？面积变成 0 时，图形还占据一个平面区域吗？</p>
</main>
<script>
// MATH_CORE_BEGIN
function determinant(m){return m[0]*m[3]-m[1]*m[2];}
function derive(m,t){
 if(!Array.isArray(m)||m.length!==4||m.some(v=>!Number.isFinite(v)))throw new TypeError('矩阵须为四个有限数，顺序[a,b,c,d]');
 if(!Number.isFinite(t)||t<0||t>1)throw new RangeError('进度须在[0,1]内');
 const B=[1-t+t*m[0],t*m[1],t*m[2],1-t+t*m[3]];
 const currentDet=determinant(B),targetDet=determinant(m);
 const u=[B[0],B[2]],v=[B[1],B[3]];
 const zero=Math.abs(currentDet)<1e-10;
 return {matrix:m.slice(),progress:t,currentMatrix:B,targetDet,currentDet,area:Math.abs(currentDet),orientation:zero?'zero':currentDet>0?'positive':'negative',u,v,corners:[[0,0],u,[u[0]+v[0],u[1]+v[1]],v]};
}
function viewportFor(m){
 const corners=[...derive(m,1).corners,[0,0],[1,0],[1,1],[0,1]];
 const xmin=Math.min(-.8,...corners.map(p=>p[0]-.7)),xmax=Math.max(2.8,...corners.map(p=>p[0]+.7));
 const ymin=Math.min(-.9,...corners.map(p=>p[1]-.7)),ymax=Math.max(2.3,...corners.map(p=>p[1]+.7));
 const scale=Math.min(720/(xmax-xmin),570/(ymax-ymin));
 return {scale,center:[360-(xmin+xmax)*scale/2,285+(ymin+ymax)*scale/2]};
}
window.detMath={determinant,derive,viewportFor};
// MATH_CORE_END
const $=id=>document.getElementById(id),svg=$('plot'),NS='http://www.w3.org/2000/svg';
const fmt=v=>Math.abs(v)<1e-9?'0':Number(v.toFixed(3)).toString();
let matrix=[1,0,0,1],progress=1,animation=null,dragging=null;
let center=[360,285],scale=160,viewportKey='';
const xy=([x,y])=>[center[0]+scale*x,center[1]-scale*y];
function el(name,attrs,text){const n=document.createElementNS(NS,name);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n;}
function updateViewport(){
 // Keep a stable view throughout an animation. Freeze it while dragging so an endpoint cannot move because of zoom.
 if(dragging)return;
 const view=viewportFor(matrix),key=JSON.stringify(view);if(key===viewportKey)return;
 viewportKey=key;center=view.center;scale=view.scale;$('grid').replaceChildren();
 const xmin=Math.floor(-center[0]/scale),xmax=Math.ceil((720-center[0])/scale);
 const ymin=Math.floor((center[1]-570)/scale),ymax=Math.ceil(center[1]/scale);
 for(let i=xmin;i<=xmax;i++){
  const [x]=xy([i,0]);$('grid').append(el('line',{x1:x,y1:0,x2:x,y2:570,stroke:i?'#e7e9e0':'#8b9c99','stroke-width':i?1:1.5}));
  if(i)$('grid').append(el('text',{x:x+3,y:Math.min(554,Math.max(18,center[1]+17)),class:'tick'},i));
 }
 for(let i=ymin;i<=ymax;i++){
  const [,y]=xy([0,i]);$('grid').append(el('line',{x1:0,y1:y,x2:720,y2:y,stroke:i?'#e7e9e0':'#8b9c99','stroke-width':i?1:1.5}));
  if(i)$('grid').append(el('text',{x:Math.min(690,Math.max(8,center[0]+6)),y:y-4,class:'tick'},i));
 }
 $('grid').append(el('text',{x:700,y:Math.min(554,Math.max(18,center[1]-8)),fill:'#6c807d','font-size':17},'x'),el('text',{x:Math.min(690,Math.max(8,center[0]+8)),y:20,fill:'#6c807d','font-size':17},'y'));
 $('unit').setAttribute('points',[[0,0],[1,0],[1,1],[0,1]].map(p=>xy(p).join(',')).join(' '));
}
function putMatrix(id,m){$(id).replaceChildren(...m.map(v=>{const n=document.createElement('span');n.textContent=fmt(v);return n;}));}
function stop(){if(animation!==null)cancelAnimationFrame(animation);animation=null;$('play').textContent='播放变换';}
function render(){
 updateViewport();
 const s=derive(matrix,progress);putMatrix('target-matrix',matrix);putMatrix('current-matrix',s.currentMatrix);
 for(const [i,k]of ['a','b','c','d'].entries()){$(k).value=matrix[i];$(k+'-value').textContent=fmt(matrix[i]);}
 $('target-det').textContent=fmt(s.targetDet);$('oriented').textContent=fmt(s.currentDet);$('area').textContent=fmt(s.area);
 $('progress').value=progress;$('progress-value').textContent=fmt(progress);
 const status={positive:'正：保持方向（逆时针）',negative:'负：方向反转（顺时针）',zero:'零：压成线段或一个点'};
 $('sign').textContent=status[s.orientation];
 const fill=s.orientation==='negative'?'#a65b3c':'#246b87';$('parallelogram').setAttribute('fill',fill);
 $('parallelogram').setAttribute('points',s.corners.map(p=>xy(p).join(',')).join(' '));
 const origin=xy([0,0]);$('origin').setAttribute('x',origin[0]-20);$('origin').setAttribute('y',origin[1]+21);
 for(const [k,v]of [['u',s.u],['v',s.v]]){
  const p=xy(v),line=$(k+'-line'),handle=$(k+'-handle'),label=$(k+'-label');
  for(const [a,val]of Object.entries({x1:origin[0],y1:origin[1],x2:p[0],y2:p[1]}))line.setAttribute(a,val);
  handle.setAttribute('cx',p[0]);handle.setAttribute('cy',p[1]);handle.setAttribute('aria-valuenow',v[0]);handle.setAttribute('aria-valuetext',`当前(${fmt(v[0])},${fmt(v[1])})；拖动后到达目标矩阵`);
  label.setAttribute('x',p[0]+(k==='u'?10:-25));label.setAttribute('y',p[1]+(k==='u'?-10:25));
 }
 const sum=xy(s.corners[2]);$('sum-label').setAttribute('x',sum[0]+8);$('sum-label').setAttribute('y',sum[1]-8);$('sum-label').setAttribute('visibility',s.orientation==='zero'?'hidden':'visible');
 // Show only a middle portion of the third edge, so the direction arrow remains separate from vector handles.
 const start=[s.corners[2][0]-.2*s.u[0],s.corners[2][1]-.2*s.u[1]],end=[s.corners[2][0]-.65*s.u[0],s.corners[2][1]-.65*s.u[1]];
 const p1=xy(start),p2=xy(end);$('boundary').setAttribute('d',`M${p1} L${p2}`);$('boundary').setAttribute('visibility',s.orientation==='zero'?'hidden':'visible');
 for(const b of document.querySelectorAll('button[data-m]'))b.setAttribute('aria-pressed',b.dataset.m.split(',').every((v,i)=>Math.abs(+v-matrix[i])<1e-8));
}
function setMatrix(m){derive(m,1);if(m.some(v=>Math.abs(v)>3))throw new RangeError('本页各元素范围为[-3,3]');stop();matrix=m.map(v=>Math.round(v*1000)/1000);progress=1;render();return derive(matrix,progress);}
function setProgress(t){derive(matrix,t);stop();progress=t;render();return derive(matrix,progress);}
window.detDemo={snapshot:()=>derive(matrix,progress),setMatrix,setProgress};
for(const [i,k]of ['a','b','c','d'].entries())$(k).addEventListener('input',()=>{const m=matrix.slice();m[i]=+$(k).value;setMatrix(m);});
for(const b of document.querySelectorAll('button[data-m]'))b.addEventListener('click',()=>setMatrix(b.dataset.m.split(',').map(Number)));
$('reset').addEventListener('click',()=>setMatrix([1,0,0,1]));$('finish').addEventListener('click',()=>setProgress(1));$('progress').addEventListener('input',()=>setProgress(+$('progress').value));
$('play').addEventListener('click',()=>{
 if(animation!==null){stop();return;}progress=0;render();$('play').textContent='暂停';let start=null;
 const tick=ts=>{if(start===null)start=ts;progress=Math.min(1,(ts-start)/3000);render();if(progress<1)animation=requestAnimationFrame(tick);else stop();};animation=requestAnimationFrame(tick);
});
function dragPoint(event){const pt=svg.createSVGPoint();pt.x=event.clientX;pt.y=event.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());return [Math.max(-3,Math.min(3,(p.x-center[0])/scale)),Math.max(-3,Math.min(3,(center[1]-p.y)/scale))].map(v=>Math.round(v*10)/10);}
for(const k of ['u','v']){
 const h=$(k+'-handle');h.addEventListener('pointerdown',e=>{stop();dragging=k;h.setPointerCapture(e.pointerId);e.preventDefault();});
 h.addEventListener('pointermove',e=>{if(dragging!==k)return;const v=dragPoint(e),m=matrix.slice(),index=k==='u'?[0,2]:[1,3];m[index[0]]=v[0];m[index[1]]=v[1];setMatrix(m);});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])h.addEventListener(event,()=>{if(dragging===k){dragging=null;render();}});
 h.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const m=matrix.slice(),index=k==='u'?[0,2]:[1,3],i=/Left|Right/.test(e.key)?index[0]:index[1],delta=/Right|Up/.test(e.key)?.1:-.1;m[i]=Math.max(-3,Math.min(3,Math.round((m[i]+delta)*10)/10));setMatrix(m);});
}
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{ $('fullscreen').title='浏览器不支持页面全屏，可用浏览器全屏快捷键'; }});
document.addEventListener('fullscreenchange',()=>{const on=!!document.fullscreenElement;$('fullscreen').textContent=on?'⊡':'⛶';$('fullscreen').setAttribute('aria-label',on?'退出全屏':'进入全屏');$('fullscreen').title=on?'退出全屏':'进入全屏';});
render();
</script></body></html>
